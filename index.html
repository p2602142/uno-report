<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Performance Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-stone-700 min-h-screen antialiased selection:bg-stone-200">
    
    <main class="max-w-md mx-auto px-4 py-8">
        
        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-stone-100 transition-all">
            
            <section id="login-section" class="space-y-6">
                <div class="text-center space-y-1.5 pt-2">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-stone-100 mb-2">
                        <svg class="w-6 h-6 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <h2 class="text-2xl font-semibold tracking-tight text-stone-800">เข้าสู่ระบบ</h2>
                    <p class="text-xs text-stone-400">กรุณากรอกข้อมูลเพื่อเข้าใช้งานระบบรายงานยอดขาย</p>
                </div>

                <div class="space-y-3.5 pt-2">
                    <div>
                        <label class="block text-xs font-medium text-stone-500 mb-1.5">อีเมล</label>
                        <input type="email" id="email" placeholder="name@company.com" 
                            class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-stone-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-stone-400 focus:ring-4 focus:ring-stone-100 transition duration-200">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-stone-500 mb-1.5">รหัสผ่าน</label>
                        <input type="password" id="password" placeholder="••••••••" 
                            class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-stone-200 rounded-xl text-sm focus:bg-white focus:outline-none focus:border-stone-400 focus:ring-4 focus:ring-stone-100 transition duration-200">
                    </div>
                    <button id="btn-login" 
                        class="w-full mt-2 bg-stone-800 hover:bg-stone-900 text-white font-medium text-sm py-3 rounded-xl shadow-sm hover:shadow active:scale-[0.99] transition duration-200">
                        เข้าสู่ระบบ
                    </button>
                    <p id="login-error" class="text-rose-500 text-xs text-center mt-2 hidden"></p>
                </div>
            </section>

            <section id="app-section" class="hidden space-y-6">
                
                <div class="flex justify-between items-center pb-4 border-b border-stone-100">
                    <div>
                        <span class="text-[10px] font-semibold tracking-wider text-stone-400 uppercase block">Daily Report</span>
                        <h1 class="text-lg font-semibold text-stone-800">บันทึกยอดขายประจำวัน</h1>
                    </div>
                    <button id="btn-logout" class="text-xs text-stone-400 hover:text-rose-600 bg-stone-50 hover:bg-rose-50 px-3 py-1.5 rounded-lg border border-stone-100 transition duration-200">
                        ออกจากระบบ
                    </button>
                </div>

                <form id="sales-form" class="space-y-4">
                    <div class="grid grid-cols-1 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-stone-500 mb-1.5">วันที่รายการ</label>
                            <input type="date" id="sales-date" required 
                                class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-stone-200 rounded-xl text-sm text-stone-700 focus:bg-white focus:outline-none focus:border-stone-400 focus:ring-4 focus:ring-stone-100 transition duration-200">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-stone-500 mb-1.5">ยอดขายรวมทั้งหมด (THB)</label>
                            <div class="relative">
                                <input type="number" id="total-sales" step="0.01" required placeholder="0.00" 
                                    class="w-full px-3.5 py-2.5 bg-stone-50/50 border border-stone-200 rounded-xl text-lg font-semibold text-stone-800 focus:bg-white focus:outline-none focus:border-stone-400 focus:ring-4 focus:ring-stone-100 transition duration-200">
                                <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-medium text-stone-400">THB</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        <label class="block text-xs font-semibold text-stone-600 mb-2.5">จำแนกตามช่องทางการชำระเงิน</label>
                        <div class="grid grid-cols-2 gap-2.5 text-xs">
                            <div class="p-2.5 bg-stone-50/60 rounded-xl border border-stone-100">
                                <span class="text-stone-400 block mb-1">Cash</span>
                                <input type="number" step="0.01" id="pay-cash" value="0" class="w-full bg-white px-2 py-1.5 border border-stone-200 rounded-lg text-sm font-medium focus:outline-none focus:border-stone-400">
                            </div>
                            <div class="p-2.5 bg-stone-50/60 rounded-xl border border-stone-100">
                                <span class="text-stone-400 block mb-1">Credit Card</span>
                                <input type="number" step="0.01" id="pay-credit" value="0" class="w-full bg-white px-2 py-1.5 border border-stone-200 rounded-lg text-sm font-medium focus:outline-none focus:border-stone-400">
                            </div>
                            <div class="p-2.5 bg-stone-50/60 rounded-xl border border-stone-100">
                                <span class="text-stone-400 block mb-1">QR Payment</span>
                                <input type="number" step="0.01" id="pay-qr" value="0" class="w-full bg-white px-2 py-1.5 border border-stone-200 rounded-lg text-sm font-medium focus:outline-none focus:border-stone-400">
                            </div>
                            <div class="p-2.5 bg-stone-50/60 rounded-xl border border-stone-100">
                                <span class="text-stone-400 block mb-1">Line Man</span>
                                <input type="number" step="0.01" id="pay-lineman" value="0" class="w-full bg-white px-2 py-1.5 border border-stone-200 rounded-lg text-sm font-medium focus:outline-none focus:border-stone-400">
                            </div>
                            <div class="p-2.5 bg-stone-50/60 rounded-xl border border-stone-100 col-span-2">
                                <span class="text-stone-400 block mb-1">Grab</span>
                                <input type="number" step="0.01" id="pay-grab" value="0" class="w-full bg-white px-2 py-1.5 border border-stone-200 rounded-lg text-sm font-medium focus:outline-none focus:border-stone-400">
                            </div>
                        </div>
                    </div>

                    <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm py-3 rounded-xl shadow-sm hover:shadow active:scale-[0.99] transition duration-200 mt-2">
                        บันทึกข้อมูลยอดขาย
                    </button>
                </form>

                <div class="pt-4 border-t border-stone-100 space-y-3">
                    <button id="btn-load-report" 
                        class="w-full bg-stone-100 hover:bg-stone-200/80 text-stone-700 font-medium py-2.5 rounded-xl text-xs transition duration-200 flex items-center justify-center gap-2">
                        <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        เรียกดูรายงานสรุปยอดขาย
                    </button>
                    
                    <div id="report-view" class="bg-stone-50/80 border border-stone-100 p-4 rounded-2xl hidden space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="bg-white p-3 rounded-xl border border-stone-100 shadow-2xs">
                                <span class="text-[11px] text-stone-400 block mb-1">ยอดขายประจำวัน</span>
                                <span id="res-daily" class="text-sm font-bold text-stone-800">0.00 THB</span>
                            </div>
                            <div class="bg-white p-3 rounded-xl border border-stone-100 shadow-2xs">
                                <span class="text-[11px] text-stone-400 block mb-1">ยอดสะสม MTD</span>
                                <span id="res-mtd" class="text-sm font-bold text-emerald-600">0.00 THB</span>
                            </div>
                        </div>

                        <div class="bg-white p-3 rounded-xl border border-stone-100">
                            <span class="text-[11px] text-stone-400 font-medium block mb-2">สัดส่วนตามช่องทางชำระเงิน</span>
                            <ul id="res-payments" class="text-xs space-y-1.5 text-stone-600 divide-y divide-stone-50"></ul>
                        </div>
                    </div>
                </div>

            </section>

        </div>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
